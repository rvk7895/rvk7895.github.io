<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Training Logs — Ritvik Aryan Kalra</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
/* FOUC-safe theme: set data-theme before first paint. Same key + list as the home (9-run-mode). */
(function () {
  try {
    var t = localStorage.getItem("poster-theme");
    if (t !== "house" && t !== "signal") t = "house"; /* dark default; legacy values → dark */
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "house");
  }
})();
</script>
<style>
  /* ============================================================
     TRAINING LOGS — single entry (template; real posts injected
     from the POSTS data by ?p=<slug>). Swiss voice shared with
     9-run-mode; body tuned for MAX readability: ~70ch measure,
     ≥18px body, generous leading.
     ============================================================ */

  /* ---------- THEME TOKENS (verbatim from 9; + terminal panel tokens) --- */
  html[data-theme="house"] {
    /* house lights — dark default, shared with the home */
    --paper:#0e0e10; --paper-2:#121214; --card:#131316;
    --ink:#ececea; --ink-soft:#c2c2bf; --ink-faint:#8e8e8c; --ink-ghost:#5d5d5c;
    --rule:#ececea; --rule-soft:#2a2a2e;
    --accent:#ff2d52; --accent-deep:#e4002b; --accent-ink:#0e0e10; --accent-wash:#ff2d521f;
    --curve:#ff2d52; --selbg:#ff2d52; --selfg:#0e0e10;
    --term-bg:#070709; --term-ink:#f2f2f2; --term-dim:#8e8e8c; --term-rule:#26262a; --term-accent:#ff5d73;
  }
  html[data-theme="signal"] {
    --paper:#ffffff; --paper-2:#fafafa; --card:#ffffff;
    --ink:#0d0d0d; --ink-soft:#3a3a3a; --ink-faint:#6f6f6f; --ink-ghost:#9c9c9c;
    --rule:#0d0d0d; --rule-soft:#dcdcdc;
    --accent:#e4002b; --accent-deep:#b80022; --accent-ink:#ffffff; --accent-wash:#e4002b14;
    --curve:#e4002b; --selbg:#e4002b; --selfg:#ffffff;
    --term-bg:#141414; --term-ink:#f2f2f2; --term-dim:#9c9c9c; --term-rule:#2c2c2c; --term-accent:#ff5d73;
  }
  html[data-theme="oxblood"] {
    --paper:#f6f3ee; --paper-2:#efeae1; --card:#fbf9f5;
    --ink:#1a1714; --ink-soft:#423c35; --ink-faint:#6c655b; --ink-ghost:#9b9387;
    --rule:#1a1714; --rule-soft:#ddd6c9;
    --accent:#7c2230; --accent-deep:#5f1924; --accent-ink:#f6f3ee; --accent-wash:#7c223014;
    --curve:#7c2230; --selbg:#7c2230; --selfg:#f6f3ee;
    --term-bg:#211a17; --term-ink:#efe7da; --term-dim:#9b8f7e; --term-rule:#3a2e28; --term-accent:#c97b86;
  }
  html[data-theme="ink"] {
    --paper:#fbfcfe; --paper-2:#f1f4fa; --card:#ffffff;
    --ink:#11151f; --ink-soft:#353c4c; --ink-faint:#67708a; --ink-ghost:#9aa2b6;
    --rule:#11151f; --rule-soft:#dde2ee;
    --accent:#1d2f7a; --accent-deep:#142158; --accent-ink:#fbfcfe; --accent-wash:#1d2f7a12;
    --curve:#1d2f7a; --selbg:#1d2f7a; --selfg:#fbfcfe;
    --term-bg:#10131c; --term-ink:#e7ecf6; --term-dim:#8a93ad; --term-rule:#262d3d; --term-accent:#7e93d8;
  }
  html[data-theme="graphite"] {
    --paper:#ffffff; --paper-2:#f3f3f3; --card:#ffffff;
    --ink:#141414; --ink-soft:#3c3c3c; --ink-faint:#707070; --ink-ghost:#9c9c9c;
    --rule:#141414; --rule-soft:#dcdcdc;
    --accent:#141414; --accent-deep:#000000; --accent-ink:#ffffff; --accent-wash:#1414140d;
    --curve:#e4002b; --selbg:#141414; --selfg:#ffffff;
    --term-bg:#141414; --term-ink:#f2f2f2; --term-dim:#9c9c9c; --term-rule:#2c2c2c; --term-accent:#bdbdbd;
  }

  :root {
    --display:"Archivo", system-ui, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --hair:1px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --dur:300ms;
    --measure:70ch;       /* the reading column */
  }

  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; width:100%;
    background:var(--paper); color:var(--ink);
    font-family:var(--display);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; font-kerning:normal;
  }
  ::selection { background:var(--selbg); color:var(--selfg); }
  a { color:inherit; }

  /* ============================================================
     MASTHEAD (proscenium — identical to index)
     ============================================================ */
  .mast {
    position:sticky; top:0; z-index:20;
    background:var(--paper); border-bottom:2px solid var(--rule);
    padding:var(--s4) var(--s6) var(--s3);
    display:grid; grid-template-columns:1fr auto; align-items:flex-end; column-gap:var(--s6);
  }
  .mast__l { min-width:0; }
  .mast__kick {
    font-family:var(--mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--accent); margin:0 0 7px; display:flex; gap:1em; align-items:baseline; flex-wrap:wrap;
  }
  .mast__kick .dot { color:var(--rule-soft); }
  .mast__kick .muted { color:var(--ink-faint); }
  .name {
    font-family:var(--display); font-weight:800; font-size:34px; line-height:0.92;
    letter-spacing:-0.03em; text-transform:uppercase; margin:0; color:var(--ink);
  }
  .name a { text-decoration:none; color:inherit; }
  .name a:hover { color:var(--accent); }
  .backrun {
    display:inline-flex; align-items:baseline; gap:0.5em; margin-top:7px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.02em;
    color:var(--ink-soft); text-decoration:none;
    border-bottom:var(--hair) solid var(--rule-soft); padding-bottom:1px;
  }
  .backrun:hover { color:var(--accent); border-color:var(--accent); }
  .backrun .arr { font-size:12px; }
  .affil { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .affil .role {
    font-family:var(--mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--accent); margin-bottom:3px; font-weight:600;
  }
  .affil a {
    font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-decoration:none;
    border-bottom:var(--hair) solid var(--rule-soft); letter-spacing:-0.01em;
  }
  .affil a:hover { color:var(--accent); border-color:var(--accent); }

  /* ============================================================
     BREADCRUMB
     ============================================================ */
  .crumbs {
    max-width:920px; margin:0 auto; padding:var(--s4) var(--s6) 0;
    font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .crumbs a { color:var(--ink-faint); text-decoration:none; }
  .crumbs a:hover { color:var(--accent); }
  .crumbs .sep { color:var(--rule-soft); margin:0 0.6em; }
  .crumbs .here { color:var(--accent); }

  /* ============================================================
     ARTICLE SHELL — reading column centered; margin notes hang right
     ============================================================ */
  /* wide enough to hold the 70ch column + 32px gap + 200px hanging notes:
     32 + 723 + 32 + 200 + 32 ≈ 1019 → 1024 */
  .article { max-width:1024px; margin:0 auto; padding:var(--s5) var(--s6) var(--s7); position:relative; }
  .col { max-width:var(--measure); }

  /* ---------------- post header ---------------- */
  .meta {
    font-family:var(--mono); font-size:11px; letter-spacing:0.04em; color:var(--ink-faint);
    display:flex; flex-wrap:wrap; gap:0.6em 0.8em; align-items:baseline; margin:0 0 var(--s4);
  }
  .meta .k { color:var(--accent); }
  .meta .sep { color:var(--rule-soft); }
  h1.title {
    font-family:var(--display); font-weight:800; font-size:clamp(30px,5vw,52px);
    line-height:1.02; letter-spacing:-0.03em; margin:0 0 var(--s5); color:var(--ink);
  }

  /* tl;dr abstract block */
  .tldr {
    border:var(--hair) solid var(--rule); border-left:3px solid var(--accent);
    background:var(--paper-2); padding:var(--s4) var(--s5); margin:0 0 var(--s6);
  }
  .tldr__lab {
    font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--accent); margin:0 0 6px;
  }
  .tldr p { margin:0; font-size:16px; line-height:1.6; color:var(--ink-soft); }
  .tldr p b { color:var(--ink); font-weight:700; }

  /* ============================================================
     BODY — readability first
     ============================================================ */
  .body { font-size:18px; line-height:1.72; color:var(--ink-soft); letter-spacing:-0.003em; }
  .body p { margin:0 0 1.25em; max-width:var(--measure); }
  .body p b, .body p strong { color:var(--ink); font-weight:700; }
  .body a.ref { color:var(--accent); text-decoration:none; border-bottom:var(--hair) solid var(--accent-wash); }
  .body a.ref:hover { border-color:var(--accent); }

  .seclabel {
    font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--accent); margin:2.2em 0 0.5em;
  }
  .body h2 {
    font-family:var(--display); font-weight:800; font-size:27px; line-height:1.1;
    letter-spacing:-0.02em; color:var(--ink); margin:0.15em 0 0.5em; max-width:var(--measure);
  }
  .body h3 {
    font-family:var(--display); font-weight:700; font-size:19px; line-height:1.2;
    letter-spacing:-0.01em; color:var(--ink); margin:1.6em 0 0.4em; max-width:var(--measure);
  }
  .body ul, .body ol { max-width:var(--measure); margin:0 0 1.25em; padding-left:1.3em; }
  .body li { margin:0 0 0.5em; }
  .body li::marker { color:var(--accent); }
  .body i, .body em { font-style:italic; }
  .body code {
    font-family:var(--mono); font-size:0.85em;
    background:var(--accent-wash); color:var(--ink); padding:1px 5px;
  }

  /* inline callout (ports the markdown 💡 aside) */
  .body .callout {
    max-width:var(--measure); margin:1.4em 0;
    border:var(--hair) solid var(--rule); border-left:3px solid var(--accent);
    background:var(--paper-2); padding:var(--s3) var(--s4);
    display:flex; gap:0.7em; align-items:flex-start;
  }
  .body .callout .ico { font-size:18px; line-height:1.5; }
  .body .callout p { margin:0; font-size:16px; }

  /* ---------------- terminal code panel (dark) ---------------- */
  .term {
    margin:1.4em 0 1.6em; max-width:var(--measure);
    border:var(--hair) solid var(--rule); background:var(--term-bg);
  }
  .term__cap {
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:var(--hair) solid var(--term-rule);
    padding:7px 12px;
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--term-dim);
  }
  .term__cap .tag { color:var(--term-accent); font-weight:600; }
  .term__cap .dots { display:flex; gap:5px; }
  .term__cap .dots i { width:8px; height:8px; border-radius:50%; background:var(--term-rule); display:inline-block; }
  .term pre {
    margin:0; padding:13px 14px; overflow-x:auto;
    font-family:var(--mono); font-size:13px; line-height:1.65; color:var(--term-ink);
    -webkit-font-smoothing:auto;
  }
  .term .cmt { color:var(--term-dim); }
  .term .kw { color:var(--term-accent); }
  .term .str { color:var(--term-dim); }

  /* results mini-table */
  .restable { margin:1.4em 0 1.6em; max-width:var(--measure); border:var(--hair) solid var(--rule); }
  .restable table { width:100%; border-collapse:collapse; }
  .restable caption {
    text-align:left; font-family:var(--mono); font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint); padding:8px 12px; border-bottom:var(--hair) solid var(--rule-soft); background:var(--paper-2);
  }
  .restable th, .restable td {
    font-family:var(--mono); font-size:13px; text-align:left; padding:8px 12px;
    border-bottom:var(--hair) solid var(--rule-soft); font-variant-numeric:tabular-nums;
  }
  .restable th { color:var(--ink-faint); font-weight:600; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; }
  .restable td:first-child { color:var(--ink-soft); }
  .restable td.num { color:var(--ink); font-weight:600; text-align:right; }
  .restable tr:last-child td { border-bottom:none; }
  .restable tr.total td { background:var(--accent-wash); color:var(--ink); }
  .restable tr.total td.num { color:var(--accent-deep); }

  /* ---------------- margin notes (hang in the right gutter) ---------------- */
  .mnote {
    /* anchored to the article's right padding edge — px-based, immune to
       the ch-resolves-in-local-font trap that put notes inside the column */
    position:absolute; right:var(--s6); left:auto; width:200px;
    font-family:var(--mono); font-size:11px; line-height:1.5; color:var(--ink-faint);
    border-left:2px solid var(--accent); padding-left:10px;
  }
  .mnote b { color:var(--ink-soft); font-weight:600; }
  .mnote .mn-lab {
    display:block; font-size:8.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--accent); margin-bottom:4px;
  }
  /* inline fallback copy (shown only on narrow) */
  .mnote-inline { display:none; }

  /* ============================================================
     CITE THIS ENTRY — expanding BibTeX
     ============================================================ */
  .cite { margin:var(--s7) 0 var(--s6); max-width:var(--measure); border:var(--hair) solid var(--rule); }
  .cite__bar {
    display:flex; width:100%; align-items:center; justify-content:space-between; gap:var(--s3);
    background:var(--paper-2); border:none; cursor:pointer; text-align:left;
    padding:11px 14px; color:var(--ink);
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
  }
  .cite__bar:hover { color:var(--accent); }
  .cite__bar .chev { transition:transform var(--dur) var(--ease); color:var(--ink-faint); }
  .cite.open .cite__bar .chev { transform:rotate(90deg); color:var(--accent); }
  .cite__body { overflow:hidden; max-height:0; transition:max-height var(--dur) var(--ease); }
  .cite.open .cite__body { max-height:420px; }
  .cite__inner { border-top:var(--hair) solid var(--rule-soft); }
  .cite__tools {
    display:flex; align-items:center; gap:var(--s3); justify-content:flex-end;
    padding:8px 12px; border-bottom:var(--hair) solid var(--rule-soft); background:var(--term-bg);
    position:relative;
  }
  .copybtn {
    font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--term-ink); background:transparent; border:var(--hair) solid var(--term-rule);
    padding:5px 11px; cursor:pointer; transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .copybtn:hover { background:var(--term-accent); color:var(--term-bg); border-color:var(--term-accent); }
  .toast {
    position:absolute; right:12px; top:-30px;
    font-family:var(--mono); font-size:10px; letter-spacing:0.04em;
    color:var(--accent-ink); background:var(--accent); padding:4px 9px;
    opacity:0; transform:translateY(4px); transition:opacity 160ms var(--ease), transform 160ms var(--ease);
    pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateY(0); }
  .cite pre {
    margin:0; padding:13px 14px; overflow-x:auto; background:var(--term-bg);
    font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--term-ink);
    -webkit-font-smoothing:auto;
  }

  /* ============================================================
     PREV / NEXT NAV + FOOTER
     ============================================================ */
  .pager {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:var(--s4);
    border-top:2px solid var(--rule); margin-top:var(--s6); padding-top:var(--s4); max-width:var(--measure);
  }
  .pager a {
    font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-decoration:none;
    letter-spacing:0.02em;
  }
  .pager a:hover { color:var(--accent); }
  .pager .prev { text-align:left; }
  .pager .all { text-align:center; color:var(--ink-faint); border-bottom:var(--hair) solid var(--rule-soft); padding-bottom:1px; }
  .pager .next { text-align:right; }
  .pager .lab { display:block; font-size:8.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-ghost); margin-bottom:2px; }

  .foot {
    border-top:var(--hair) solid var(--rule-soft); margin-top:var(--s6); padding-top:var(--s4);
    max-width:var(--measure);
    font-family:var(--mono); font-size:9px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-ghost); line-height:1.5;
  }

  /* ============================================================
     THEME SWITCHER (fixed proscenium)
     ============================================================ */
  .themes {
    position:fixed; right:14px; bottom:14px; z-index:30;
    display:flex; gap:6px; align-items:center;
    background:var(--paper); border:var(--hair) solid var(--rule); padding:6px 8px;
  }
  .themes__lab { font-family:var(--mono); font-size:8px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); margin-right:2px; }
  .sw { width:16px; height:16px; border:var(--hair) solid var(--rule); cursor:pointer; padding:0; }
  .sw[aria-pressed="true"] { outline:2px solid var(--ink); outline-offset:1px; }
  .sw--house { background:#0e0e10; box-shadow: inset 0 0 0 1.5px #ff2d52; }
  .sw--signal { background:#e4002b; } .sw--oxblood { background:#7c2230; }
  /* lights toggle (replaces the swatch group) */
  .lights {
    position: fixed; right: 14px; bottom: 14px; z-index: 60;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; font-weight: 600;
    color: var(--ink-soft); background: var(--paper);
    border: var(--hair) solid var(--rule); cursor: pointer;
    padding: 8px 12px;
  }
  .lights:hover { color: var(--accent); border-color: var(--accent); }
  .lights .bulb { font-size: 13px; line-height: 1; }
  .lights .l-dark, html[data-theme="house"] .lights .l-light { display: none; }
  html[data-theme="house"] .lights .l-dark { display: inline; }
  .sw--ink { background:#1d2f7a; } .sw--graphite { background:#141414; }

  /* ============================================================
     VIEW TRANSITION (progressive enhancement; JS fallback on file://)
     ============================================================ */
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: vt-slide-out-left 460ms cubic-bezier(.76,0,.24,1) both; }
  ::view-transition-new(root) { animation: vt-slide-in-right 460ms cubic-bezier(.76,0,.24,1) both; }
  @keyframes vt-slide-out-left { to { transform:translateX(-8%); opacity:0; } }
  @keyframes vt-slide-in-right { from { transform:translateX(100%); } to { transform:translateX(0); } }
  .vt-enter { animation: page-slide-in 460ms cubic-bezier(.76,0,.24,1) both; }
  @keyframes page-slide-in { from { transform:translateX(28px); opacity:0; } to { transform:translateX(0); opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root), ::view-transition-new(root) { animation:none !important; }
    .vt-enter, .cite__bar .chev, .toast, .copybtn { animation:none !important; transition:none !important; }
  }

  /* ============================================================
     RESPONSIVE — margin notes collapse inline; measure → full width
     ============================================================ */
  @media (max-width: 1100px) {
    .mnote { display:none; }                 /* gutter too tight for hanging notes */
    .mnote-inline {
      display:block; margin:1.2em 0; max-width:var(--measure);
      border-left:2px solid var(--accent); padding-left:12px;
      font-family:var(--mono); font-size:13px; line-height:1.55; color:var(--ink-faint);
    }
    .mnote-inline b { color:var(--ink-soft); font-weight:600; }
    .mnote-inline .mn-lab { display:block; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  }
  @media (max-width: 700px) {
    .mast { grid-template-columns:1fr; row-gap:var(--s3); align-items:start; padding:var(--s3) var(--s4); }
    .affil { text-align:left; align-items:flex-start; }
    .name { font-size:26px; }
    .crumbs { padding:var(--s3) var(--s4) 0; }
    .article { padding:var(--s4) var(--s4) var(--s6); }
    .col, .body p, .body h2, .body h3, .body ul, .term, .restable, .cite, .pager, .foot, .tldr { max-width:100%; }
    :root { --measure:100%; }
    .body { font-size:17px; line-height:1.68; }
    .pager { grid-template-columns:1fr; gap:var(--s3); text-align:left; }
    .pager .prev, .pager .all, .pager .next { text-align:left; }
  }
</style>

      slug: "interesting-stuff", id: "e004", date: "2023-07-05", read: "2 min",

      body:
        '<h2>The Ostrich Algorithm: A Strategy in Computer Science</h2>' +
        '<p>The Ostrich Algorithm is a strategy in computer science that suggests ignoring problems that are exceedingly rare. The name of this algorithm comes from the ostrich effect, which is a cognitive bias where people avoid negative information by pretending it does not exist or hiding from it.</p>' +
        '<p>This algorithm is commonly used in operating systems, where ignoring rare problems can be the most efficient way to handle them. For example, in a multiprocessor algorithm, if it reaches a deadlock but the condition to reach the deadlock is exceedingly rare, and the probability suggests that it happens only once in a decade, then that problem can be ignored.</p>' +
        '<p>The Ostrich Algorithm is a simple yet powerful concept that can help software engineers optimize their systems. By ignoring extremely rare problems, they can focus on more pressing issues and increase the overall efficiency of their algorithms. However, it is important to use this algorithm judiciously, as ignoring too many problems can lead to serious issues down the line.</p>' +
        '<p>In conclusion, the Ostrich Algorithm is a useful tool for software engineers that can help them prioritize and optimize their work. By understanding when to ignore rare problems, they can improve the efficiency of their algorithms and avoid unnecessary headaches in the future.</p>'
    },
    {
      slug: "keyboard", id: "e003", date: "2023-07-04", read: "4 min",
      title: "Building my own mechanical keyboard",
      tags: ["mechanical-keyboards", "DIY", "keyboards"],
      body:
        '<h2>BOUGHT THE MONSGEEK M1W PRE-BUILT. WAITING FOR IT TO DELIEVER</h2>' +
        '<h3>Decided the keyboard</h3>' +
        '<p>So, I think I’ve decided the components that I would be going for to build my keyboard.</p>' +
        '<p>Base - <b>Zuoya LMK81.</b> I had been surfing r/mkindia when I saw the independence day sale for keyboards on <a class="ref" href="http://stickeys.in" target="_blank" rel="noopener">stickeys.in</a>, a vendor I had not been aware of. And well browsing there I found</p>' +
        '<h3>Introduction</h3>' +
        '<p>I’ve wanted to build a custom mechanical keyboard for a while now. It all started when I stumbled upon my first MK in one of my college senior’s rooms (Sorry, I don’t remember your name but thank you for introducing me to MKs &lt;3; you probably resided on the ground floor of Bakul Niwas in IIIT Hyderabad in 2019).</p>' +
        '<p>Let me tell you, there is nothing like typing on a mechanical keyboard. The sound it makes is so satisfying, and the feeling is just a <i>chef’s kiss</i>. I find myself typing away on it for hours on end to feel that sensation. It’s like a mini dopamine hit every time I press a key.</p>' +
        '<p>I had always been putting it off until the day I would receive a big paycheck, and well, the day has finally arrived. I should’ve planned for it, but for some reason, I had always been delaying that, but today somehow, I’ve got the motivation to build one, so yeah.</p>' +
        '<p>But it’s not like that; I’d not thought about it; I do randomly watch youtube videos on mechanical keyboards and occasionally use some of my friend’s MKs, so I do have a clue of what I want to build. So here’s what I have in mind -</p>' +
        '<ol>' +
        '<li>A 65% layout. Just cause I don’t feel like having a big keyboard, but I do need the arrow keys, which 60% layout does not have.</li>' +
        '<li>I will definitely be going for Cherry MX brown switches. I love the blues cause of the sound (yeah, I love to annoy people with that tat tat tat clicking noise 😈).</li>' +
        '<li>Obviously would be going for a Hot Swappable PCB board cause I don’t want to solder my switches. (It might save money, but too much hassle and I’m scared of soldering and messing shit up). Also need to have the option to swap out my switches.</li>' +
        '<li>DEFINITELY NEEDS TO BE RGB.</li>' +
        '<li>My budget is 10-15k. I have no idea how much building a custom mechanical keyboard would cost. This budget is based on the cost of Ducky’s 65% keyboards.</li>' +
        '<li>I don’t want a standard keyboard. Need to have some wow factor about it.</li>' +
        '</ol>' +
        '<p>I know a couple of resources that I’m referring to for building my keyboard. I’ll list them down below in case anyone else is interested.</p>' +
        '<ul>' +
        '<li><a class="ref" href="https://www.youtube.com/watch?v=bBon6WwkdJE" target="_blank" rel="noopener">Build your own Mechanical Keyboard… the RIGHT Way - YouTube</a> - Linus Tech Tips (Its LTT. This has to be there)</li>' +
        '<li><a class="ref" href="https://www.reddit.com/r/mkindia/" target="_blank" rel="noopener">Indian Mechanical Keyboards (reddit.com)</a> - A good place to find resources for noobs like me to find stores to buy parts of a mechanical keyboard and get advice</li>' +
        '</ul>' +
        '<h3>Updates July 6, 2023</h3>' +
        '<p>So i’ve found out that building a fully custom MK is not that easy of a task (ofcourse why would it be) and being a complete novice in this field, I’ve a feeling I should be going towards building a macroboard which looks something like this</p>' +
        '<p>Yup sounds underwhelming but this would be an easier route go with, but I haven’t decided that. I’ll now document what I’ve learned today about keyboards today.</p>' +
        '<ul><li>So as we all know a keyboard</li></ul>' +
        '<h3>Resources</h3>' +
        '<ul>' +
        '<li><a class="ref" href="https://www.youtube.com/watch?v=bBon6WwkdJE" target="_blank" rel="noopener">Build your own Mechanical Keyboard… the RIGHT Way - YouTube</a> - Linus Tech Tips (Its LTT. This has to be there)</li>' +
        '<li><a class="ref" href="https://www.reddit.com/r/mkindia/" target="_blank" rel="noopener">Indian Mechanical Keyboards (reddit.com)</a> - A good place to find resources for noobs like me to find stores to buy parts of a mechanical keyboard and get advice</li>' +
        '<li>The GOLEM keyboard Project - <a class="ref" href="https://golem.hu/" target="_blank" rel="noopener">golem.hu - Golem Keyboard Project</a></li>' +
        '<li>Flashing your PCB with QMK - <a class="ref" href="https://keebsforall.com/blogs/tutorials-for-beginners/how-to-flash-pcb-keyboard-with-qmk" target="_blank" rel="noopener">How To Flash PCB/Keyboard With QMK</a></li>' +
        '</ul>'

    {
      slug: "effective-java", id: "e002", date: "2023-06-27", read: "4 min",
      title: "Effective Java Notes",
      tags: ["coding", "java"],
      body:
        '<p>I recently started to read the book Effective Java, to improve my coding habits and to learn in-depth about the functionalities provided by Java. Here I would be adding notes of the items that I think are relevant could be helpful to me in future and might to others also.</p>' +
        '<h2>Builders</h2>' +
        '<p>When the class has a lot of optional parameters, one should consider using Builder. Builders allow you the flexibility which Static Factories and Constructors don’t for optional parameters.</p>' +
        '<p>Traditionally the design pattern of <a class="ref" href="https://www.captaindebug.com/2011/05/telescoping-constructor-antipattern" target="_blank" rel="noopener"><b>telescoping constructor</b></a> was used in case of optional parameters. But that makes you write a lot of redundant code, which later can become unreadable with many methods of the same name.</p>' +
        '<p>Another method which can be used to tackle the problem of optional parameters is that of using <code>setter</code> methods. Here we can use a constructor to just create an object and then use the setter methods to assign attributes to that object. Something like</p>' +
        TERM('java', 'Test.java',
          'class Test {\n' +
          '\tprivate int a1;\n' +
          '\tprivate int a2;\n' +
          '\t//setters\n' +
          '\tpublic void seta1(int val) {a1 = val;}\n' +
          '\tpublic void seta2(int val) {a2 = val;}\n' +
          '}\n\n' +
          '//inside main\n' +
          'Test test = new Test();\n' +
          'test.seta1(1);') +
        '<p>This is the <b>JavaBean</b> pattern. But this strategy has its own disadvantages, first being that the object would be in an inconsistent state for sometime, and second being that it automatically precludes the possibility of the class being immutable.</p>' +
        '<p>Hence to cover for the advantages come builder classes. There syntax is as follows:</p>' +
        TERM('java', 'Test.java (builder)',
          'class Test {\n' +
          '\tprivate int a1;\n' +
          '\tprivate int a2;\n' +
          '\tprivate int a3;\n\n' +
          '\tpublic static class Builder {\n' +
          '\t\t//required\n' +
          '\t\tprivate final int a1;\n\n' +
          '\t\t//optional\n' +
          '\t\tprivate int a2 = 0;\n' +
          '\t\tprivate int a3 = 0;\n\n' +
          '\t\tpublic Builder(int a1) {\n' +
          '\t\t\tthis.a1 = a1\n' +
          '\t\t}\n\n' +
          '\t\tpublic Builder a2(int val) {\n' +
          '\t\t\ta2 = val; return this;\n' +
          '\t\t}\n\n' +
          '\t\tpublic Builder a3(int val) {\n' +
          '\t\t\ta3 = val; return this;\n' +
          '\t\t}\n\n' +
          '\t\tpublic Test build() {\n' +
          '\t\t\treturn new Builder(this);\n' +
          '\t\t}\n' +
          '\t}\n\n' +
          '\tprivate Test(Builder builder) {\n' +
          '\t\ta1 = builder.a1;\n' +
          '\t\ta2 = builder.a2;\n' +
          '\t\ta3 = builder.a3;\n' +
          '\t}\n' +
          '}\n\n' +
          '//inside main\n' +
          'Test test = new Test.Builder(a1).a2(a2).build()') +
        '<p>Using this pattern, instead of making the object directly, the client calls a constructor with all of the required parameters and gets a builder object. Using this builder object, we get access to setter methods which returns the same builder object but after setting some parameters of the object for which the setter method was invoked. Then finally the <code>build</code> methods is called which returns the desired class’s object.</p>' +
        '<p>This is a substitute for the named optional parameters in Python and Scala.</p>' +
        '<p><code>Builder</code> functionality is also well suite to class hierarchies. I’ll come back to this when I have covered <i>recursive type parameter</i> and <code>clone()</code></p>' +
        '<h3>References:</h3>' +
        '<ul><li><a class="ref" href="https://www.captaindebug.com/2011/05/telescoping-constructor-antipattern" target="_blank" rel="noopener">Captain Debug’s Blog: The Telescoping Constructor (Anti)Pattern</a></li></ul>' +
        '<h2>Static Factory Methods</h2>' +
        '<p>Static factory methods in Java are basically like constructors but carry a meaningful name to them. They are static methods that return an instance of the native class. These methods can come in handy when you need to have multiple constructors that return the object but with some form of different configuration.</p>' +
        '<div class="callout"><span class="ico">💡</span><p>In case you forgot, <code>static</code> methods don’t need an object of a class to be called. Thus these static factory methods come in handy.</p></div>' +
        '<p>These methods have the following advantages over constructors -</p>' +
        '<ol>' +
        '<li>Static Factory methods allow reuse of already created instances or use cached instances of a class, instead of creating new ones. This can lead to improve in performances. An example of this is is <code>Boolean.valueOf(boolean var)</code></li>' +
        '<li>It can also return an object of the subtype thus giving you more flexibility over choice of the class of the object returned. This also allows to return object of classes without making those classes public.</li>' +
        '<li>As I had mentioned earlier, another advantage is that object can vary from call to call as function of the input parameters. <code>Enum</code> class makes use of this advantage and thus does not have any public constructors.</li>' +
        '</ol>'
    },
    {
      slug: "good-coding", id: "e001", date: "2023-06-23", read: "4 min",
      title: "Good Coding Practices",
      tags: ["coding"],
      body:
        '<h2>Write better log statements</h2>' +
        '<p>As a developer, you might assume that adding logging statements is an easy job. After all, what’s there to it? Just write a simple <code>print</code> or <code>System.out.println()</code> statement, and you’re done, right? (Although, let’s be real, Java, what’s up with that unnecessarily long syntax?)</p>' +
        '<p>However, the reality is that logging is one of the most essential tools for debugging your code. Without proper logging, you can’t easily track down bugs, troubleshoot issues, or understand how your code is behaving in different environments. And if you’re not writing descriptive log statements that are easily understood by other developers, then it’s as good as a knitted condom - it might look good, but it’s not going to be helpful when you really need it.</p>' +
        '<p>So, how can you write better log statements? How can you make sure that your logging is effective and helpful for you, your team, and any other developers who might need to work with your code? Here are some tips to consider:</p>' +
        '<ul>' +
        '<li>Use meaningful log messages that provide information about the context in which the log message is being generated. This can include details like the function or method where the log message is being generated, the values of any relevant variables, and any other contextual information that might be helpful for understanding what’s happening.</li>' +
        '<li>Use log levels appropriately to indicate the severity of the log message. For example, you might use a "debug" log level for messages that are only relevant for developers, and a "warning" log level for messages that indicate potential issues that should be addressed.</li>' +
        '<li>Avoid using hard-coded strings in log messages. Instead, use constants or variables to make log messages more maintainable and easier to read. This can help ensure that all your log messages are consistent and use the same terminology, which can be especially helpful when you’re dealing with a complex codebase.</li>' +
        '<li>Be consistent in your log message format and structure. This can include details like the order of the message components, the use of whitespace and line breaks, and any other formatting details that can help make your log messages more readable and consistent.</li>' +
        '<li>Include relevant information such as the timestamp, thread ID, and relevant metadata. This can help you track down issues and understand how your code is behaving in different environments.</li>' +
        '<li>Use log aggregation tools such as Logstash, Fluentd, or Splunk to centralize and analyze your logs. These tools can help you easily search through your logs, identify patterns or trends, and troubleshoot issues more quickly and effectively.</li>' +
        '</ul>' +
        '<p>By following these tips, you can improve your logging and make it more effective for your team and your codebase. So, don’t skimp on your logging - take the time to write clear, concise, and helpful log messages that will make your life easier in the long run.</p>' +
        '<h2>Close your goddamn resources</h2>' +
        '<p>One of the most common reasons on why builds in production fail is because of improper usage of the resources. A typical application nowadays would deal will deal with a lot of resources like <b>Files, Sockets and Database Connections</b>. These resources need to be handled with a lot of care, because an operating system allocates the application system resources, and typically systems have an upper limit on this. If for some reason the program fails or an exception occurs and the resources aren’t freed up, it keeps on building up, and this leads to application servers being frequently restarted when resource exhaustion occurs.</p>' +
        '<p>For any resources that has been opened, a corresponding call to its <code>close()</code> method should be made. Also effective use of <code>try/catch/finally</code> is needed when dealing with outside resources, to make sure that any execution path leads to proper closing of the resources also.</p>' +
        '<p>Many programming languages like Python and Ruby provide language level facilities which allow automatic handling of resources. In Java also a programming construct known as <code>try-with-resource</code> allows an effective way for automatic handling of resources. The syntax for <code>try-with-resource</code> is as follows:</p>' +
        TERM('java', 'try-with-resource',
          'try(\n' +
          '\t\t\t//Resource 1 Declaration;\n' +
          '\t\t\t// .\n' +
          '\t\t\t// .\n' +
          '\t\t\t//Resource n Declaration;\n' +
          '\t\t) {\n' +
          '\t\t\t\t// code\n' +
          '\t\t\t}\n' +
          'catch {\n' +
          '\t\t\t\t//code\n' +
          '\t\t\t}')
    }
  ];

  function escAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    var m = /[?&]p=([^&]+)/.exec(window.location.search);

      "Set in Archivo &amp; IBM Plex Mono · entry " + p.id + " · " + p.date + "<br>" +
